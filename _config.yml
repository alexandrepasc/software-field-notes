# Site Build Settings

# jekyll-paginate configuration
paginate:            5

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
exclude:             [docs]
# Canonical GitHub Pages project-page address. Required for valid feed,
# sitemap and seo-tag output; makes share intents carry the real post URL
# and keeps local builds byte-identical to production for absolute links.
url:                 "https://alexandrepasc.github.io"
baseurl:             "/software-field-notes"
# Publish posts whose date has not passed yet (scheduled posts must still build)
future:              true
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           "Software Field Notes"
description:	       "Practical notes from exploring software, hardware, and technology."
author:              "Alexandre Pascoal"

# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
