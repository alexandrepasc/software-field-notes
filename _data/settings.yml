# Change 'comments' to true for Disqus comments
disqus:
  comments: false
  disqus_shortname: 'millennial-3'

# Comments powered by GitHub Discussions via giscus (https://giscus.app).
# Prerequisites: Discussions enabled on the repo, the giscus app
# (https://github.com/apps/giscus) installed on it, and a thread category
# (Announcements type recommended: only maintainers open discussions).
# repo_id is the public API node_id; category_id is shown by the generator
# at https://giscus.app once you pick the repository and category there.
# Flip 'enabled' to true once both IDs below are real.
giscus:
  enabled: true
  repo: 'alexandrepasc/software-field-notes'
  repo_id: 'R_kgDOT9_Ltw'
  category: 'Blog comments'
  category_id: 'DIC_kwDOT9_Lt84DD9hJ'

# If you are not using Google Analytics, please change 'google-ID' to an empty string
# google-ID: 'UA-112060364-2'

# - {name: 'Interesting Facts',  url: 'facts'}
# - {name: 'Learning Resources', url: 'resources'}
# - {name: 'Sample Posts',       url: 'sample-posts'}
# - {name: 'Documentation',      url: 'documentation'}

menu:
  # - {name: 'Development', url: 'development'}
  - {name: 'About', url: 'about'}

# Available social icons are powered by Font Awesome, so you can use any icon that they offer
# Icon values are rendered as class="fa fa-<icon>": use plain FA 4 names (e.g. 'github'), or
# 'brands <name>' for Font Awesome 6 brand icons loaded via _includes/head.html (e.g.
# 'brands fa-x-twitter' -> class="fa fa-brands fa-x-twitter"), required for logos missing
# from FA 4 such as the X rebrand.
# Brands absent from Font Awesome entirely can set `svg_path` instead: the include then
# renders an inline SVG from that path (Simple Icons convention, viewBox 0 0 24 24),
# e.g. daily.dev -> icon 'dailydev'. Set `view_box` too when the path's ink does not
# fill the canvas (daily.dev spans y 5.29..18.71): cropping to the ink lets the CSS
# baseline-align the mark exactly like the font glyphs.
# TODO: update social links with the blog's own accounts
social:
  - {icon: 'brands fa-x-twitter', link: 'https://x.com/alexandrepasc'}
  - {icon: 'brands fa-mastodon', link: 'https://mastodon.world/@alexandre_pascoal'}
  - {icon: 'brands fa-linkedin', link: 'https://www.linkedin.com/in/alexandre-pascoal-b7199680/'}
  - {
      icon: 'dailydev',
      link: 'https://daily.dev/alexandrepascoal',
      view_box: '0 5.2945 24 13.411',
      svg_path: 'M18.29 5.706a1.405 1.405 0 0 0-1.987 0L4.716 17.296l1.324-2.65-2.65-2.649 3.312-3.311 2.65 2.65 1.986-1.988-3.642-3.642a1.405 1.405 0 0 0-1.987 0L.411 11.004a1.404 1.404 0 0 0 0 1.987l4.305 4.304.993.993a1.405 1.405 0 0 0 1.987 0L19.285 6.7l-.993-.994Zm-.332 3.647 2.65 2.65-4.306 4.305a1.404 1.404 0 1 0 1.986 1.986l5.299-5.298a1.404 1.404 0 0 0 0-1.987l-4.305-4.304-1.324 2.648Z'
  }
