<div class="post-share">
  <div class="post-date">{{ site.data.settings.sharing_button_prompt }}</div>
  <div class="sharing-icons">
    <!-- Share intents follow the social list order from _data/settings.yml
         (X, Mastodon, LinkedIn, daily.dev); Facebook is share-only.
         absolute_url yields the canonical post URL in every environment.
         Params are url_encode'd so titles with spaces/& survive. -->
    <a
      href="https://x.com/intent/tweet?text={{ page.title | url_encode }}&amp;url={{ page.url | absolute_url | url_encode }}"
      target="_blank"
      ><i class="fa fa-brands fa-x-twitter" aria-hidden="true"></i
    ></a>
    <a
      href="https://mastodon.social/share?text={{ page.title | append: ' ' | append: page.url | absolute_url | url_encode }}"
      target="_blank"
      ><i class="fa fa-brands fa-mastodon" aria-hidden="true"></i
    ></a>
    <a
      href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}"
      target="_blank"
      ><i class="fa fa-brands fa-linkedin" aria-hidden="true"></i
    ></a>
    <a href="https://app.daily.dev/suggest" target="_blank"
      ><svg
        class="social-svg fa-dailydev"
        role="img"
        viewBox="0 5.2945 24 13.411"
        aria-hidden="true"
      >
        <path
          d="M18.29 5.706a1.405 1.405 0 0 0-1.987 0L4.716 17.296l1.324-2.65-2.65-2.649 3.312-3.311 2.65 2.65 1.986-1.988-3.642-3.642a1.405 1.405 0 0 0-1.987 0L.411 11.004a1.404 1.404 0 0 0 0 1.987l4.305 4.304.993.993a1.405 1.405 0 0 0 1.987 0L19.285 6.7l-.993-.994Zm-.332 3.647 2.65 2.65-4.306 4.305a1.404 1.404 0 1 0 1.986 1.986l5.299-5.298a1.404 1.404 0 0 0 0-1.987l-4.305-4.304-1.324 2.648Z"
        /></svg
    ></a>
    <a
      href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}&amp;title={{ page.title | url_encode }}"
      target="_blank"
      ><i class="fa fa-facebook" aria-hidden="true"></i
    ></a>
  </div>
</div>
